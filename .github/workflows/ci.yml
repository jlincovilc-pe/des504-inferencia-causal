name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Entorno y reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del núcleo
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib seaborn statsmodels scikit-learn networkx

      - name: Verificar entorno y datos
        run: python scripts/verificar_entorno.py

      - name: Reproducir el experimento canónico (Cap. 1)
        run: python recursos/ejemplo_paradoja_canonico.py
